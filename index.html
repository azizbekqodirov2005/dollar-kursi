<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dollar Kursi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Onest:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div class="top">
    <span class="brand">Dollar Kursi</span>
    <div class="top-right">
      <button type="button" class="pill" id="refresh">Yangilash</button>
      <button type="button" class="pill" id="theme" aria-pressed="false"><span class="dot" aria-hidden="true"></span><span id="themeText">Tungi rejim</span></button>
    </div>
  </div>

  <section class="hero" aria-label="Markaziy bank kursi">
    <span class="label">1 AQSH dollari · Markaziy bank</span>
    <div class="rate" id="rate">Yuklanmoqda…</div>
    <span class="delta" id="delta" hidden></span>
    <span class="status" id="status" aria-live="polite"></span>
  </section>

  <section class="card" aria-label="Konvertor">
    <h2>Hisoblash</h2>
    <div class="row">
      <label class="field"><span class="label" id="fromLabel">Dollar</span>
        <input id="amount" inputmode="decimal" autocomplete="off" value="100" aria-labelledby="fromLabel"></label>
      <span class="cur" id="fromCur">USD</span>
    </div>
    <button type="button" class="swap" id="swap" aria-label="Yo'nalishni almashtirish">⇅ Almashtirish</button>
    <div class="row">
      <label class="field"><span class="label" id="toLabel">So'm</span>
        <input id="result" readonly aria-labelledby="toLabel"></label>
      <span class="cur" id="toCur">UZS</span>
    </div>
    <div class="chips" id="chips" aria-label="Tez summalar"></div>
  </section>

  <p class="note">Manba: <a href="https://cbu.uz" target="_blank" rel="noopener">O'zbekiston Respublikasi Markaziy banki</a>. Kurs sahifa ochilganda va har 5 daqiqada o'zi yangilanadi. Markaziy bank kursni kuniga bir marta belgilaydi.</p>
</main>

<script src="script.js"></script>
</body>
</html>
